<?xml version="1.0" standalone="no"?>
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.2"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="inflate" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#0f172a"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <circle cx="960" cy="540" r="640" fill="url(#glow)"/>

  <!-- 障碍物与代价地图膨胀层 -->
  <g>
    <circle cx="640" cy="380" r="130" fill="url(#inflate)"/>
    <circle cx="1180" cy="700" r="140" fill="url(#inflate)"/>
    <circle cx="1420" cy="330" r="110" fill="url(#inflate)"/>
    <rect x="590" y="330" width="100" height="100" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="2.5" opacity="0.9"/>
    <rect x="1120" y="640" width="120" height="120" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="2.5" opacity="0.9"/>
    <rect x="1375" y="285" width="90" height="90" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="2.5" opacity="0.9"/>
  </g>

  <!-- 全局路径（虚线） -->
  <path d="M300,760 C520,760 560,540 760,520 C980,498 1000,290 1240,270 C1440,254 1520,420 1640,470"
        fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="18 14" opacity="0.55"/>

  <!-- 局部路径（实线，带箭头） -->
  <path d="M300,760 C480,760 540,600 700,540"
        fill="none" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- 路径点 -->
  <g fill="#0f172a" stroke="#38bdf8" stroke-width="3">
    <circle cx="760" cy="520" r="13"/>
    <circle cx="1240" cy="270" r="13"/>
  </g>

  <!-- 机器人本体与朝向 -->
  <circle cx="300" cy="760" r="46" fill="#38bdf8" opacity="0.25"/>
  <circle cx="300" cy="760" r="30" fill="#7dd3fc"/>
  <path d="M300,760 L372,736" stroke="#e0f2fe" stroke-width="6" stroke-linecap="round"/>

  <!-- 目标点 -->
  <g fill="none" stroke="#ec4899" stroke-width="4">
    <circle cx="1640" cy="470" r="46" opacity="0.5"/>
    <circle cx="1640" cy="470" r="26"/>
  </g>
  <circle cx="1640" cy="470" r="9" fill="#ec4899"/>

  <path d="M0,980 Q480,900 960,980 T1920,980" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25"/>
</svg>
