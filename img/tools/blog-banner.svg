<?xml version="1.0" standalone="no"?>
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.2"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#0f172a"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <circle cx="960" cy="540" r="620" fill="url(#glow)"/>

  <!-- Markdown 源文件 -->
  <g transform="translate(360,540)">
    <rect x="-130" y="-180" width="260" height="360" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="3.5"/>
    <path d="M130,-180 L60,-180 L60,-110 L130,-110 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <g stroke="#ec4899" stroke-width="7" stroke-linecap="round">
      <path d="M-88,-120 H-10"/>
    </g>
    <g stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" opacity="0.75">
      <path d="M-88,-60 H70"/>
      <path d="M-88,-14 H88"/>
      <path d="M-88,32 H40"/>
      <path d="M-88,78 H78"/>
      <path d="M-88,124 H14"/>
    </g>
  </g>

  <!-- 构建齿轮 -->
  <g transform="translate(960,540)">
    <circle r="132" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.35"/>
    <g fill="#1e293b" stroke="#7dd3fc" stroke-width="3.5">
      <circle r="96"/>
    </g>
    <g stroke="#7dd3fc" stroke-width="3.5" fill="#1e293b">
      <rect x="-17" y="-134" width="34" height="42" rx="6"/>
      <rect x="-17" y="-134" width="34" height="42" rx="6" transform="rotate(60)"/>
      <rect x="-17" y="-134" width="34" height="42" rx="6" transform="rotate(120)"/>
      <rect x="-17" y="-134" width="34" height="42" rx="6" transform="rotate(180)"/>
      <rect x="-17" y="-134" width="34" height="42" rx="6" transform="rotate(240)"/>
      <rect x="-17" y="-134" width="34" height="42" rx="6" transform="rotate(300)"/>
    </g>
    <circle r="38" fill="none" stroke="#ec4899" stroke-width="4"/>
  </g>

  <!-- 浏览器页面 -->
  <g transform="translate(1560,540)">
    <rect x="-170" y="-190" width="340" height="380" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="3.5"/>
    <path d="M-170,-130 H170" stroke="#38bdf8" stroke-width="2.5" opacity="0.6"/>
    <g fill="#ec4899" opacity="0.85">
      <circle cx="-140" cy="-160" r="9"/>
      <circle cx="-110" cy="-160" r="9"/>
      <circle cx="-80" cy="-160" r="9"/>
    </g>
    <rect x="-140" y="-100" width="280" height="96" rx="10" fill="#0f172a" stroke="#7dd3fc" stroke-width="2" opacity="0.7"/>
    <g stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" opacity="0.7">
      <path d="M-140,40 H120"/>
      <path d="M-140,86 H140"/>
      <path d="M-140,132 H60"/>
    </g>
  </g>

  <!-- 流程箭头 -->
  <g stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" marker-end="url(#f)" opacity="0.9">
    <path d="M520,540 H790"/>
    <path d="M1120,540 H1370"/>
  </g>

  <path d="M0,990 Q480,910 960,990 T1920,990" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25"/>
  <path d="M0,1010 Q480,930 960,1010 T1920,1010" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.2"/>
</svg>
