<?xml version="1.0" standalone="no"?>
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.2"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="#0f172a"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <circle cx="960" cy="540" r="620" fill="url(#glow)"/>

  <!-- 后层堆叠的终端窗口，暗示多终端并行 -->
  <g opacity="0.35">
    <rect x="450" y="230" width="1020" height="560" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  </g>
  <g opacity="0.6">
    <rect x="415" y="262" width="1020" height="560" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <!-- 前层主终端窗口 -->
  <g>
    <rect x="380" y="294" width="1020" height="560" rx="24" fill="#111c30" stroke="#38bdf8" stroke-width="3.5"/>
    <path d="M380,364 H1400" stroke="#38bdf8" stroke-width="2.5" opacity="0.65"/>
    <g>
      <circle cx="424" cy="329" r="11" fill="#ec4899"/>
      <circle cx="462" cy="329" r="11" fill="#7dd3fc" opacity="0.8"/>
      <circle cx="500" cy="329" r="11" fill="#38bdf8" opacity="0.55"/>
    </g>

    <!-- 提示符与命令行 -->
    <g stroke-linecap="round">
      <path d="M436,430 l30,26 l-30,26" fill="none" stroke="#ec4899" stroke-width="7"/>
      <path d="M496,456 H880" stroke="#7dd3fc" stroke-width="9" opacity="0.9"/>
      <path d="M436,530 H700" stroke="#38bdf8" stroke-width="7" opacity="0.4"/>
      <path d="M436,586 H980" stroke="#38bdf8" stroke-width="7" opacity="0.4"/>
      <path d="M436,642 H820" stroke="#38bdf8" stroke-width="7" opacity="0.4"/>

      <path d="M436,716 l30,26 l-30,26" fill="none" stroke="#ec4899" stroke-width="7"/>
      <path d="M496,742 H760" stroke="#7dd3fc" stroke-width="9" opacity="0.9"/>
    </g>
    <!-- 光标 -->
    <rect x="784" y="722" width="26" height="40" fill="#e0f2fe" opacity="0.9"/>
  </g>

  <path d="M0,980 Q480,900 960,980 T1920,980" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25"/>
  <path d="M0,1000 Q480,920 960,1000 T1920,1000" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.2"/>
</svg>
